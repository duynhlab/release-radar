name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tool catalog
        run: node scripts/validate-catalog.ts

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Markdown corpus gate
        run: pnpm audit:markdown --check

      - name: Build
        run: pnpm build

      # Proves the central constraint on a real build: the catalog index reaches
      # the worker and release notes never do. Nothing else catches a refactor
      # that turns the asset fetch back into a static import.
      - name: Check worker bundle
        run: pnpm check:bundle
