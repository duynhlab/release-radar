name: Sync releases

on:
  workflow_dispatch:
  schedule:
    # 09:17 + 21:17 local time; not on the top of the hour to dodge peak-load delays
    - cron: "17 9,21 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tool catalog
        run: node scripts/validate-catalog.ts

      - name: Sync GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-releases.ts

      # Release notes are the one input that changes with no human in the loop.
      # Gating only on PRs would let a new upstream note containing an <iframe>
      # ship straight to production on a scheduled sync; here it fails the data
      # commit instead.
      - name: Markdown corpus gate
        run: pnpm audit:markdown --check

      # ci.yaml skips data-only pushes (paths-ignore: data/**), but Cloudflare
      # still rebuilds on them. Without this the first thing to notice a
      # malformed index would be a failed Workers Build at 09:17, with nobody
      # watching and no release data reaching production. `pnpm gen` runs the
      # exact IndexSchema parse that the build performs.
      - name: Verify the synced data builds
        run: pnpm gen

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name  "duynebot"
            git config user.email "duynebot@users.noreply.github.com"
            git add data
            git commit -m "chore(data): sync releases $(date -u +%F)"
            git push
          else
            echo "No release changes, skipping commit"
          fi
