      strategy: github-releases
      includePrerelease: false
      tagPattern: "^v\\d+\\.\\d+\\.\\d+$"

  - id: istio
    name: Istio
    category: networking
    repository: istio/istio
    description: Service mesh for observability, security and traffic management
    homepage: https://istio.io
    documentation: https://istio.io/latest/docs/
    tags:
      - service-mesh
      - kubernetes
    release:
      strategy: github-releases
      includePrerelease: false
      tagPattern: "^\\d+\\.\\d+\\.\\d+$"

  - id: envoy-gateway
    name: Envoy Gateway
    category: networking
    repository: envoyproxy/gateway
    description: Manages Envoy Proxy as a Kubernetes gateway
    homepage: https://gateway.envoyproxy.io
    documentation: https://gateway.envoyproxy.io/docs/
