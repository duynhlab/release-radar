      strategy: github-releases
      includePrerelease: false
      tagPattern: "^v\\d+\\.\\d+\\.\\d+$"

  - id: gateway-api
    name: Gateway API
    category: networking
    repository: kubernetes-sigs/gateway-api
    description: Kubernetes next-generation routing and traffic management API
    homepage: https://gateway-api.sigs.k8s.io
    documentation: https://gateway-api.sigs.k8s.io/guides/
