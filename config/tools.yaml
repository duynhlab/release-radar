      strategy: github-releases
      includePrerelease: false
      tagPattern: "^v\\d+\\.\\d+\\.\\d+$"

  - id: keda
    name: KEDA
    category: platform
    repository: kedacore/keda
    description: Kubernetes event-driven autoscaling
    homepage: https://keda.sh
    documentation: https://keda.sh/docs/
