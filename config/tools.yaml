    release:
      strategy: github-releases
      includePrerelease: false
      tagPattern: "^v\\d+\\.\\d+\\.\\d+$"

  - id: vm-helm-charts
    name: VictoriaMetrics Helm Charts
    category: observability
    repository: VictoriaMetrics/helm-charts
    description: Helm charts for all VictoriaMetrics components (mixed, per-chart releases)
    homepage: https://victoriametrics.com
    documentation: https://docs.victoriametrics.com/helm/
    tags:
      - helm-chart
      - kubernetes
    group: victoriametrics
    release:
      strategy: github-releases
      includePrerelease: false
      tagPattern: "\\d+\\.\\d+\\.\\d+$"

  - id: cloudnative-pg
    name: CloudNativePG
    category: data
    repository: cloudnative-pg/cloudnative-pg
    description: PostgreSQL operator for Kubernetes
    homepage: https://cloudnative-pg.io
    documentation: https://cloudnative-pg.io/documentation/
    tags:
      - postgresql
